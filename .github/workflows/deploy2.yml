name: Deploy to FitVision

on:
  push:
    branches:
      - main
      - development
      - QA

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH key and Test SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Start the SSH agent and capture its environment variables
          eval "$(ssh-agent -s)"
          # Unlock the key using the passphrase from the secret
          echo "${{ secrets.SSH_PASSPHRASE }}" | ssh-add ~/.ssh/id_rsa
          # Add the server to known_hosts to avoid interactive prompts
          ssh-keyscan -H 174.138.124.25 >> ~/.ssh/known_hosts
          # Optionally, list the loaded keys for debugging
          ssh-add -l
          # Test SSH connection without explicitly specifying the identity file
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 adonis@174.138.124.25 "echo 'SSH connection successful'"
      
      - name: Set deployment directory
        id: set-deploy-dir
        run: |
          case "${{ github.ref_name }}" in
            main)
              echo "DEPLOY_DIR=/var/www/production" >> $GITHUB_ENV ;;
            development)
              echo "DEPLOY_DIR=/var/www/dev" >> $GITHUB_ENV ;;
            QA)
              echo "DEPLOY_DIR=/var/www/qa" >> $GITHUB_ENV ;;
            *)
              echo "Unknown branch: ${{ github.ref_name }}" >&2
              exit 1 ;;
          esac

      - name: Deploy to server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10" ./build/ adonis@174.138.124.25:"${DEPLOY_DIR}"/
